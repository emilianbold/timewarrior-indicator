name: Build macOS Application

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build macOS Universal Binary
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Check Swift version
        run: swift --version

      - name: Build for x86_64 (Intel)
        run: |
          cd macos
          swiftc -O -target x86_64-apple-macosx12.0 \
            TimeWarriorMenuBar.swift \
            -o TimeWarriorMenuBar-x86_64

      - name: Build for arm64 (Apple Silicon)
        run: |
          cd macos
          swiftc -O -target arm64-apple-macosx12.0 \
            TimeWarriorMenuBar.swift \
            -o TimeWarriorMenuBar-arm64

      - name: Create Universal Binary
        run: |
          cd macos
          lipo -create -output TimeWarriorMenuBar \
            TimeWarriorMenuBar-x86_64 \
            TimeWarriorMenuBar-arm64

          # Verify the universal binary
          lipo -info TimeWarriorMenuBar
          file TimeWarriorMenuBar

      - name: Create App Bundle
        run: |
          cd macos

          # Create app bundle structure
          mkdir -p "TimeWarriorMenuBar.app/Contents/MacOS"
          mkdir -p "TimeWarriorMenuBar.app/Contents/Resources"

          # Copy binary
          cp TimeWarriorMenuBar "TimeWarriorMenuBar.app/Contents/MacOS/"
          chmod +x "TimeWarriorMenuBar.app/Contents/MacOS/TimeWarriorMenuBar"

          # Copy Info.plist
          cp Info.plist "TimeWarriorMenuBar.app/Contents/"

          # Verify app structure
          ls -la TimeWarriorMenuBar.app/Contents/MacOS/

          # Show binary info
          file "TimeWarriorMenuBar.app/Contents/MacOS/TimeWarriorMenuBar"

      - name: Code Sign (optional)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/v'))
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          cd macos

          # Skip if no certificate is configured
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "⚠️  No signing certificate configured - skipping code signing"
            echo "📝 To enable code signing, add the following secrets to your repository:"
            echo "   - MACOS_CERTIFICATE: Base64-encoded .p12 certificate"
            echo "   - MACOS_CERTIFICATE_PWD: Password for the certificate"
            echo "   - MACOS_SIGNING_IDENTITY: Developer ID (e.g., 'Developer ID Application: Your Name')"
            exit 0
          fi

          echo "🔐 Setting up code signing..."

          # Create keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          # Create temporary keychain
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Decode and import certificate
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)

          # Sign the application
          echo "✍️  Signing application..."
          codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" \
            --timestamp \
            "TimeWarriorMenuBar.app/Contents/MacOS/TimeWarriorMenuBar"

          codesign --force --options runtime --sign "$MACOS_SIGNING_IDENTITY" \
            --timestamp \
            "TimeWarriorMenuBar.app"

          # Verify signature
          echo "✅ Verifying signature..."
          codesign --verify --verbose "TimeWarriorMenuBar.app"
          codesign -dvv "TimeWarriorMenuBar.app" 2>&1 | grep -E "(Authority|Identifier|TeamIdentifier)"

          # Clean up
          rm certificate.p12

          echo "✅ Code signing complete!"

      - name: Create DMG (optional)
        run: |
          cd macos

          # Create a temporary directory for DMG contents
          mkdir -p dmg-temp
          cp -R TimeWarriorMenuBar.app dmg-temp/

          # Create DMG
          hdiutil create -volname "TimeWarrior MenuBar" \
            -srcfolder dmg-temp \
            -ov -format UDZO \
            TimeWarriorMenuBar.dmg

          # Verify DMG
          ls -lh TimeWarriorMenuBar.dmg

      - name: Create ZIP archive
        run: |
          cd macos
          zip -r TimeWarriorMenuBar.zip TimeWarriorMenuBar.app
          ls -lh TimeWarriorMenuBar.zip

      - name: Upload App Bundle Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWarriorMenuBar-macOS-Universal
          path: macos/TimeWarriorMenuBar.app
          retention-days: 30

      - name: Upload ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWarriorMenuBar-macOS-Universal-ZIP
          path: macos/TimeWarriorMenuBar.zip
          retention-days: 30

      - name: Upload DMG Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TimeWarriorMenuBar-macOS-Universal-DMG
          path: macos/TimeWarriorMenuBar.dmg
          retention-days: 30

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v1
        with:
          files: |
            macos/TimeWarriorMenuBar.zip
            macos/TimeWarriorMenuBar.dmg
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
